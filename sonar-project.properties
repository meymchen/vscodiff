sonar.projectKey=meymchen_vscodiff
sonar.organization=meymchen
sonar.projectName=vscodiff

sonar.sources=.
sonar.exclusions=tests/**,.venv/**,coverage.xml
sonar.tests=tests

sonar.python.version=3.12, 3.13
sonar.python.coverage.reportPaths=coverage.xml

# char_code.py intentionally defines char-code constants a-z/A-Z that differ
# only by case, so S1845 is a false positive for this file.
sonar.issue.ignore.multicriteria=1
sonar.issue.ignore.multicriteria.1.ruleKey=python:S1845
sonar.issue.ignore.multicriteria.1.resourceKey=src/vscodiff/common/char_code.py
